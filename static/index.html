<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- 站点标题（由 app.js loadSiteSetting 动态替换为站点名） -->
    <title id="pageTitle">XS File Library</title>

    <!-- 第三方库：Bootstrap（栅格/按钮/弹窗）与图标，已本地化到 static/vendor（CDN 加固）-->
    <link href="./static/vendor/bootstrap.min.css" rel="stylesheet">
    <link href="./static/vendor/bootstrap-icons.min.css" rel="stylesheet">
    <!-- 自有样式：主界面 + 预览灯箱 -->
    <link href="./static/style.css" rel="stylesheet">
    <link href="./static/preview.css" rel="stylesheet">
</head>

<body>
    <!-- ===== 登录页：登录成功后隐藏 ===== -->
    <div id="login-page" class="login-container">
        <div class="card p-4 shadow">
            <h3 class="mb-3" id="siteTitle">
                XS File Library
            </h3>
            <input type="text" id="username" class="form-control mb-2" placeholder="用户名">

            <input type="password" id="password" class="form-control mb-3" placeholder="密码">
            <button class="btn btn-primary" id="loginBtn">
                登录
            </button>
        </div>
    </div>

    <!-- ===== 主界面：默认隐藏，登录成功后显示 ===== -->
    <div id="main-page" style="display:none;">
        <!-- 移动端顶栏（桌面端隐藏，≤768px 显示） -->
        <div id="mobileHeader" class="mobile-header">

            <div class="mobile-header-top">
                <div id="mobileSiteTitle">
                    📁 XS File Library
                </div>
                <button id="mobileThemeBtn" class="mobile-theme-btn" onclick="toggleDarkMode()">
                    🌙
                </button>
            </div>

            <div class="mobile-user">
                当前用户： <span id="mobileUserName">
                    未登录
                </span>
            </div>

        </div>
        <!-- 侧边栏（桌面端显示，≤768px 隐藏）：导航入口 + 当前用户 -->
        <div class="sidebar">
            <h4>📁 <span id="sideTitle">XS File Library</span> </h4>
            <hr>
            <button id="darkModeBtn" class="btn btn-secondary w-100 mt-2" onclick="toggleDarkMode()">
                🌙 深色模式
            </button>
            <hr>
            <div class="user-panel">
                <div>
                    当前用户：
                    <span id="currentUser">
                        未登录
                    </span>
                </div>
            </div>
            <hr>
            <button id="viewFileBtn" class="btn btn-secondary w-100 mt-2" onclick="showFilePage()">
                📁 文件管理
            </button>
            <button id="shareManageBtn" class="btn btn-secondary w-100 mt-2" onclick="showShareManager()">
                🔗 链接管理
            </button>
            <button id="userManageBtn" class="btn btn-secondary w-100 mt-2" onclick="showUserManager()">
                🧑‍🤝‍🧑 用户管理
            </button>
            <button id="settingManageBtn" class="btn btn-secondary w-100 mt-2" onclick="showSetManager()">
                ⚙️ 系统设置
            </button>
            <hr>
        </div>
        <!-- 主内容区：顶部任务容器（zip 打包进度卡片）+ 四个互斥面板 -->
        <div class="content">
            <!-- 文件夹打包任务的进度卡片容器（默认空） -->
            <div id="taskContainer" class="task-container">
            </div>

            <!-- ① 文件管理面板（搜索 / 上传 / 新建文件夹 / 文件列表） -->
            <div id="filePage">
                <div class="header-bar">
                    <input id="search" class="form-control" placeholder="🔍 搜索文件">
                </div>

                <div id="uploadArea" class="toolbar-card">
                    <div class="toolbar-row">
                        <input type="file" id="fileInput" class="form-control">
                        <button class="btn btn-primary" id="uploadBtn">
                            上传
                        </button>
                    </div>
                    <div class="toolbar-row">
                        <input id="folderName" class="form-control" placeholder="📁 新建文件夹">
                        <button class="btn btn-primary" onclick="createFolder()">
                            创建
                        </button>
                    </div>
                    <div class="toolbar-row">
                        <div id="folderSelect" class="current-folder">
                            .
                        </div>
                        <div class="current-folder-title">
                            当前目录
                        </div>
                    </div>
                </div>

                <div id="fileList">
                </div>
            </div>

            <!-- ② 共享管理面板（统一展示共享链接 + 访客上传链接） -->
            <div id="shareManagerPage" style="display:none">
                <div class="share-header">
                    <h3>🔗 共享与上传链接</h3>
                    <span class="share-count" id="shareCount">
                        0 个链接
                    </span>
                </div>
                <div id="shareList"></div>
            </div>
            <!-- ③ 用户管理面板（新增 / 删除） -->
            <div id="userManagerPage" style="display:none;">
                <h3>🧑‍🤝‍🧑 用户管理</h3>
                <div class="card p-3">
                    <h5>新增用户</h5>
                    <input id="newUsername" class="form-control mb-2" placeholder="用户名">
                    <input id="newPassword" type="password" class="form-control mb-2" placeholder="密码">
                    <h5>权限设置</h5>

                    <div class="permission-list">
                        <label>
                            <input type="checkbox" value="upload">
                            上传文件
                        </label>
                        <label>
                            <input type="checkbox" value="download">
                            下载文件
                        </label>
                        <label>
                            <input type="checkbox" value="delete">
                            删除文件
                        </label>
                        <label>
                            <input type="checkbox" value="share">
                            文件共享
                        </label>
                        <label>
                            <input type="checkbox" value="share_manage">
                            共享管理
                        </label>
                        <label>
                            <input type="checkbox" value="user_manage">
                            用户管理
                        </label>
                        <label>
                            <input type="checkbox" value="system_manage">
                            系统设置
                        </label>
                    </div>
                    <button class="btn btn-success" onclick="addUser()">
                        新增用户
                    </button>
                </div>
                <div class="card p-3">
                    <h5>删除用户</h5>
                    <table class="table">
                        <thead>
                            <tr>
                                <th>用户名</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="userTable">
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- ④ 系统设置面板（站点名称 / 文件根目录） -->
            <div id="settingManagerPage" style="display:none;">
                <h3>⚙️ 系统设置</h3>
                <div class="card p-3">
                    <div class="mb-3">
                        <label>系统名称</label>
                        <input id="siteName" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label>文件根目录</label>
                        <input id="rootPath" class="form-control">
                    </div>
                </div>
                <hr>
                <button class="btn btn-primary" onclick="saveSettings()">
                    保存
                </button>
            </div>
        </div>
        <!-- 移动端底部导航（桌面端隐藏，≤768px 显示） -->
        <div id="mobileNav" class="mobile-nav">

            <button id="mobileFileBtn" onclick="showFilePage()">
                📁
                <span>文件</span>
            </button>

            <button id="mobileShareBtn" onclick="showShareManager()">
                🔗
                <span>共享</span>
            </button>

            <button id="mobileUserBtn" onclick="showUserManager()">
                👥
                <span>用户</span>
            </button>

            <button id="mobileSettingBtn" onclick="showSetManager()">
                ⚙️
                <span>配置</span>
            </button>

        </div>

    </div>

    <!-- ===== 弹窗组（bootstrap modal） ===== -->

    <!-- 共享链接：有效期 / 提取密码 / 共享模式 -->
    <div class="modal fade" id="shareModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">创建共享链接</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal">
                    </button>
                </div>

                <div class="modal-body">
                    <label>共享有效期</label>
                    <select id="shareDays" class="form-select">
                        <option value="1">1天</option>
                        <option value="7" selected>7天</option>
                        <option value="30">30天</option>
                        <option value="90">90天</option>
                        <option value="365">1年</option>
                    </select>
                    <hr>
                    <label>提取密码</label>
                    <input id="sharePassword" class="form-control" placeholder="留空则无需密码">
                    <hr>
                    <select id="shareMode" class="form-select">
                        <option value="normal">
                            普通文件共享
                        </option>
                        <option value="album">
                            相册模式
                        </option>
                    </select>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">
                        取消
                    </button>
                    <button class="btn btn-primary" id="createShareBtn">
                        创建共享
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 文件夹权限：勾选可访问该文件夹的用户 -->
    <div class="modal fade" id="folderPermissionModal">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5>文件夹权限</h5>
                </div>

                <div class="modal-body" id="folderPermissionUsers">
                </div>

                <div class="modal-footer">
                    <button onclick="saveFolderPermission()" class="btn btn-primary">
                        保存
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 文件预览：#previewContent 由 preview.js 填充（图片灯箱/视频/音频/PDF/文本） -->
    <div class="modal fade" id="previewModal">
        <div class="modal-dialog modal-xl">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 id="previewTitle">
                        文件预览
                    </h5>
                    <button class="btn-close" data-bs-dismiss="modal">
                    </button>
                </div>

                <div class="modal-body">
                    <div id="previewContent">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 重命名文件：默认值取路径末段 -->
    <div class="modal fade" id="renameModal">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    重命名
                </div>
                <div class="modal-body">
                    <input id="renameInput" class="form-control">
                </div>
                <div class="modal-footer">
                    <button class="btn btn-primary" onclick="confirmRename()">
                        保存
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 链接二维码：#qrImage 由 app.js showLinkQr 填充后端 /api/qr/{id} 的 PNG -->
    <div class="modal fade" id="qrModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content text-center p-4">
                <h5 class="modal-title mb-3">链接二维码</h5>
                <img id="qrImage" alt="链接二维码"
                     style="width:220px;height:220px;margin:auto;display:block">
                <div id="qrUrlText"
                     class="qr-copy-hint text-muted small mt-3 mb-1"
                     style="cursor:pointer;word-break:break-all">
                </div>
                <div class="text-muted" style="font-size:12px">点击链接可复制 · 扫码设备需能访问本机服务地址</div>
                <div class="modal-footer" style="justify-content:center">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 脚本加载顺序：先公共工具 → 业务逻辑 → 预览 → bootstrap（弹窗依赖） -->
    <script src="./static/common.js"></script>
    <script src="./static/app.js"></script>
    <script src="./static/preview.js"></script>
    <script src="./static/vendor/bootstrap.bundle.min.js"></script>
</body>

</html>
