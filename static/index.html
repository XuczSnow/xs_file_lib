<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>XS File Library</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/style.css" rel="stylesheet">
</head>

<body>
    <div id="login-page" class="login-container">
        <div class="card p-4 shadow">
            <h3 class="mb-3">
                File Library Pro
            </h3>
            <input type="text" id="username" class="form-control mb-2" placeholder="用户名">

            <input type="password" id="password" class="form-control mb-3" placeholder="密码">
            <button class="btn btn-primary" id="loginBtn">
                登录
            </button>
        </div>
    </div>

    <div id="main-page" style="display:none;">
        <div class="sidebar">
            <h4>📁 文件库</h4>
            <hr>
            <button class="btn btn-sm btn-secondary" onclick="toggleDarkMode()">
                🌙 模式
            </button>
            <hr>
            <div class="user-panel">
                <div>
                    👤 用户：
                    <span id="currentUser">
                        未登录
                    </span>
                </div>
                <div>
                    🔑 角色：
                    <span id="currentRole">
                        -
                    </span>
                </div>
            </div>
            <hr>

            <button id="userManageBtn" class="btn btn-secondary w-100" onclick="showUserManager()">
                👥 用户管理
            </button>

            <hr>
            <div id="userManagerPage" style="display:none;">
                <h3>用户管理</h3>
                <div class="card p-3">
                    <h5>新增用户</h5>
                    <input id="newUsername" class="form-control mb-2" placeholder="用户名">
                    <input id="newPassword" type="password" class="form-control mb-2" placeholder="密码">
                    <select id="newRole" class="form-select mb-2">
                        <option value="viewer">
                            viewer
                        </option>
                        <option value="user">
                            user
                        </option>
                        <option value="admin">
                            admin
                        </option>
                    </select>
                    <button class="btn btn-success" onclick="addUser()">
                        新增用户
                    </button>

                </div>
                <hr>
                <table class="table">
                    <thead>
                        <tr>
                            <th>用户名</th>
                            <th>角色</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="userTable">
                    </tbody>
                </table>
            </div>
        </div>
        <div class="content">
            <div class="header-bar">
                <input id="search" class="form-control" placeholder="🔍 搜索文件">
            </div>

            <div id="uploadArea" class="toolbar-card">
                <div class="toolbar-row">
                    <input type="file" id="fileInput" class="form-control">
                    <button class="btn btn-primary" id="uploadBtn">
                        上传
                    </button>
                </div>
                <div class="toolbar-row">
                    <input id="folderName" class="form-control" placeholder="📁 新建文件夹">
                    <button class="btn btn-primary" onclick="createFolder()">
                        创建
                    </button>
                </div>
                <div class="toolbar-row">
                    <select id="folderSelect" class="form-select">
                        <option value="">
                            .
                        </option>
                    </select>
                    <label class="btn btn-secondary">
                        目标目录
                    </label>
                </div>
            </div>

            <div id="fileList">
            </div>
        </div>
    </div>

    <script src="./static/app.js"></script>
</body>

</html>
