<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>访问数据看板</title>
    <link href="/static/vendor/bootstrap.min.css" rel="stylesheet">
    <link href="/static/vendor/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/static/css/dashboard.css" rel="stylesheet">
</head>

<body class="dash-body">
    <!-- 顶栏：标题 + 站点名 + 更新时间 + 刷新 -->
    <header class="dash-topbar">
        <div class="topbar-left">
            <i class="bi bi-bar-chart-fill topbar-icon"></i>
            <div>
                <h1 class="topbar-title">访问数据看板</h1>
                <div class="topbar-sub" id="dashSub">站点：<span id="dashSite">…</span></div>
            </div>
        </div>
        <div class="topbar-right">
            <span class="topbar-updated" id="dashUpdated"></span>
            <button class="btn btn-primary btn-sm" id="refreshBtn">
                <i class="bi bi-arrow-clockwise"></i> 刷新
            </button>
        </div>
    </header>

    <!-- 加载占位 -->
    <div id="dashLoading" class="dash-loading">
        <div class="spinner-border text-primary" role="status"></div>
        <div class="mt-2 text-secondary small">正在加载访问数据…</div>
    </div>

    <!-- 未授权 / 无数据提示 -->
    <div id="dashError" class="dash-error" style="display:none;">
        <i class="bi bi-shield-lock"></i>
        <div>暂无访问数据，或登录已失效。<br><small>请在管理页登录（需 token）后刷新本页。</small></div>
    </div>

    <!-- 看板主体 -->
    <main id="dashBody" class="dash-body-main" style="display:none;">

        <!-- 核心指标卡 -->
        <div class="kpi-grid">
            <div class="kpi-card">
                <div class="kpi-icon kpi-icon-blue"><i class="bi bi-eye"></i></div>
                <div class="kpi-val" id="kpiPv">-</div>
                <div class="kpi-label">总访问 PV</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-icon kpi-icon-teal"><i class="bi bi-people"></i></div>
                <div class="kpi-val" id="kpiUv">-</div>
                <div class="kpi-label">独立访客 UV</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-icon kpi-icon-violet"><i class="bi bi-link-45deg"></i></div>
                <div class="kpi-val" id="kpiLinks">-</div>
                <div class="kpi-label">活跃链接</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-icon kpi-icon-amber"><i class="bi bi-clock-history"></i></div>
                <div class="kpi-val" id="kpiToday">-</div>
                <div class="kpi-label">今日访问</div>
            </div>
        </div>

        <!-- 近 7 天趋势（CSS 柱状图，含数值标签 + 峰值高亮） -->
        <section class="panel">
            <div class="panel-head">
                <h5><i class="bi bi-graph-up"></i> 近 7 天访问趋势</h5>
                <span class="panel-hint" id="dailyHint"></span>
            </div>
            <div id="dailyChart" class="daily-chart"></div>
        </section>

        <div class="two-col">
            <!-- TOP 10 IP -->
            <section class="panel">
                <div class="panel-head">
                    <h5><i class="bi bi-globe2"></i> TOP 10 访客 IP</h5>
                </div>
                <div id="topIpWrap" class="table-wrap">
                    <table class="table dash-table mb-0">
                        <thead>
                            <tr><th>IP 地址</th><th class="text-end">访问次数</th></tr>
                        </thead>
                        <tbody id="statTopIp"></tbody>
                    </table>
                </div>
            </section>

            <!-- 各链接 PV -->
            <section class="panel">
                <div class="panel-head">
                    <h5><i class="bi bi-list-ol"></i> 各链接访问</h5>
                </div>
                <div id="perLinkWrap" class="table-wrap">
                    <table class="table dash-table mb-0">
                        <thead>
                            <tr><th>链接 ID</th><th class="text-end">PV</th></tr>
                        </thead>
                        <tbody id="statPerLink"></tbody>
                    </table>
                </div>
            </section>
        </div>

        <footer class="dash-footer">
            数据实时聚合（磁盘日志 + 内存缓冲）· 访问接口受 token 保护 ·
            <a href="/" id="backHome">返回管理页</a>
        </footer>
    </main>

    <script src="/static/js/common.js"></script>
    <script src="/static/js/dashboard.js"></script>
</body>

</html>
