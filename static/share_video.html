<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>视频播放</title>
    <link href="/static/vendor/bootstrap.min.css" rel="stylesheet">
    <link href="/static/vendor/bootstrap-icons.min.css" rel="stylesheet">

    <!-- 视频播放页：样式抽离到 /static/css/share_video.css；与相册页统一浅色风格 -->
    <link href="/static/css/share_video.css" rel="stylesheet">

</head>

<body>

    <div class="player-layout">

        <!-- 主播放区：播放器 + 下方胶囊菜单栏（居中：返回共享/上一集/下一集/连播/下载/全屏） -->
        <div class="player-main">
            <div class="video-content" id="videoContent">
                <video id="videoPlayer" controls preload="metadata"></video>
            </div>
            <div class="player-controls">
                <div class="vid-switch">
                    <a id="backToShare" class="pill-btn" href="/share/" title="返回共享">
                        <i class="bi bi-box-arrow-left"></i><span class="lbl">返回共享</span></a>
                    <button id="prevEp" class="pill-btn" title="上一集" aria-label="上一集" disabled>
                        <i class="bi bi-skip-start-fill"></i><span class="lbl">上一集</span></button>
                    <button id="nextEp" class="pill-btn" title="下一集" aria-label="下一集" disabled>
                        <span class="lbl">下一集</span><i class="bi bi-skip-end-fill"></i></button>
                    <!-- 格式分片选择（share_video.js 动态渲染"自动/H.264/HEVC/AV1/VP9"下拉框，
                         当前选集只有一个分片时整个下拉框隐藏） -->
                    <span class="pill-sep"></span>
                    <select id="fmtSelect" class="fmt-select" title="选择视频格式分片" aria-label="选择视频格式"></select>
                    <button id="autoplayBtn" class="pill-btn active" title="自动连播：开" aria-label="自动连播">
                        <i class="bi bi-collection-play-fill"></i><span class="lbl">连播</span></button>
                    <button id="downloadBtn" class="pill-btn" title="下载当前视频" aria-label="下载当前视频">
                        <span class="lbl">下载</span><i class="bi bi-download"></i></button>
                    <button id="maxBtn" class="pill-btn" title="全屏" aria-label="全屏">
                        <i class="bi bi-fullscreen"></i><span class="lbl">全屏</span></button>
                </div>
            </div>
        </div>

        <!-- 选集面板：缩略图 + 编号 + 文件名 + 大小；点击切源不重开窗口 -->
        <aside class="ep-panel" id="epPanel">
            <h5>选集 <span class="ep-count" id="epCount"></span></h5>
            <div class="ep-list" id="epList">
                <div class="ep-empty">加载中...</div>
            </div>
        </aside>

    </div>

    <!-- common.js（XSLib）+ 本页逻辑 -->
    <script src="/static/js/common.js"></script>
    <script src="/static/js/share_video.js"></script>

</body>

</html>
