<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>视频播放</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {

            background: #0f172a;

            min-height: 100vh;

            margin: 0;

            display: flex;

            justify-content: center;

            align-items: center;

        }

        .player-container {

            width: 100%;

            max-width: 1400px;

            padding: 20px;

        }

        video {

            width: 100%;

            max-height: 85vh;

            background: black;

            border-radius: 12px;

        }

        .video-title {

            color: white;

            font-size: 20px;

            text-align: center;

            margin-bottom: 12px;

        }
    </style>

</head>

<body>

    <div class="player-container">

        <div id="videoTitle" class="video-title">

            加载中...

        </div>
        <div class="video-content" id="videoContent">
            <video id="videoPlayer" controls>

            </video>
        </div>

    </div>

    <script>

        window.onload =
            async function () {

                const parts =
                    window.location.pathname
                        .split("/");

                const shareId =
                    parts[3];

                const filename =
                    decodeURIComponent(parts.slice(4).join("/"));

                const filepath = shareId + "/" + 
                    encodeURIComponent(filename)
                
                document.getElementById(
                    "videoTitle"
                ).innerText =
                    filename;

                document.getElementById(
                    "videoContent"
                ).innerHTML = `
                <video
                    controls
                    preload="metadata">

                    <source
                        src="/api/video-stream/${filepath}"
                        type="video/mp4">

                </video>

                `

            };

    </script>

</body>

</html>
