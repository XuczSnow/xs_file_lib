<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>访客文件上传</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px
        }

        .card {
            max-width: 600px;
            width: 100%
        }
    </style>
</head>

<body>
    <div class="card shadow p-4">
        <h3 class="mb-3">📤 文件上传</h3>
        <div class="mb-2" id="folderInfo">加载中...</div>
        <div class="mb-3" id="expireInfo"></div>
        <input type="password" id="uploadPassword" class="form-control mb-3" placeholder="访问密码（如有）">
        <input type="file" id="fileInput" class="form-control mb-3">
        <button class="btn btn-primary" onclick="uploadFile()">上传文件</button>
        <div id="msg" class="mt-3"></div>
    </div>
    <script>
        let uploadId = '';
        window.onload = async function () {
            uploadId = window.location.pathname.split('/').pop();
            const r = await fetch('/api/upload-info/' + uploadId);
            const d = await r.json();
            if (!d.success) { document.getElementById('folderInfo').innerText = '上传链接无效'; return; }
            document.getElementById('folderInfo').innerText = '目标目录：' + d.folder;
            document.getElementById('expireInfo').innerText = '有效期至：' + d.expire;
            if (!d.has_password) { document.getElementById('uploadPassword').style.display = 'none'; }
        }
        async function uploadFile() {
            const file = document.getElementById('fileInput').files[0];
            if (!file) { alert('请选择文件'); return; }
            const fd = new FormData();
            fd.append('upload_id', uploadId);
            fd.append('password', document.getElementById('uploadPassword')?.value || '');
            fd.append('file', file);
            const r = await fetch('/api/guest-upload', { method: 'POST', body: fd });
            const d = await r.json();
            document.getElementById('msg').innerHTML = d.success ? '✅ 上传成功' : '❌ ' + (d.message || '上传失败');
        }
    </script>
</body>

</html>
