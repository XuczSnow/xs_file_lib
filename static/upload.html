<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>访客文件上传</title>
    <link href="/static/vendor/bootstrap.min.css" rel="stylesheet">
    <!-- 访客上传页内联样式：全屏居中卡片布局 -->
    <style>
        body {
            background: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px
        }

        .card {
            max-width: 600px;
            width: 100%
        }
    </style>
</head>

<body>
    <!-- 访客上传卡片：目标目录/有效期由 load 拉取，密码框按需显隐 -->
    <div class="card shadow p-4">
        <h3 class="mb-3">📤 文件上传</h3>
        <!-- 目标目录与有效期（由 /api/upload-info 填充） -->
        <div class="mb-2" id="folderInfo">加载中...</div>
        <div class="mb-3" id="expireInfo"></div>
        <!-- 链接设置了密码时才显示 -->
        <input type="password" id="uploadPassword" class="form-control mb-3" placeholder="访问密码（如有）">
        <input type="file" id="fileInput" class="form-control mb-3">
        <button class="btn btn-primary" onclick="uploadFile()">上传文件</button>
        <!-- 结果提示（成功/失败） -->
        <div id="msg" class="mt-3"></div>
    </div>

    <!-- 公共工具（非本页必须，保持与其他页面一致的引入约定） -->
    <script src="/static/common.js"></script>
    <script>
        /*
         * 访客上传内联脚本。
         * 加载流程：取 URL 末段作为 uploadId → /api/upload-info 校验
         * 并展示目标目录/有效期 → 用户选文件后 POST /api/guest-upload。
         */
        let uploadId = '';
        window.onload = async function () {
            // 访客页 URL 形如 /upload/{upload_id}，末段即 ID
            const parts = window.location.pathname.split('/');
            uploadId = parts[parts.length - 1];
            const r = await fetch('/api/upload-info/' + uploadId);
            const d = await r.json();
            if (!d.success) {
                document.getElementById('folderInfo').textContent =
                    d.expired ? '上传链接已过期' : '上传链接无效';
                document.getElementById('fileInput').disabled = true;
                document.querySelector('button[onclick]') && (document.querySelector('button[onclick]').disabled = true);
                return;
            }
            document.getElementById('folderInfo').textContent = '目标目录：' + d.folder;
            document.getElementById('expireInfo').textContent = '有效期至：' + d.expire;
            // 无密码则隐藏密码输入框
            if (!d.has_password) {
                document.getElementById('uploadPassword').style.display = 'none';
            }
        }
        /* 提交上传：附 uploadId + 密码（可空）+ 文件，结果用 textContent 显示 */
        async function uploadFile() {
            const file = document.getElementById('fileInput').files[0];
            if (!file) { alert('请选择文件'); return; }
            const fd = new FormData();
            fd.append('upload_id', uploadId);
            fd.append('password', document.getElementById('uploadPassword')?.value || '');
            fd.append('file', file);
            const r = await fetch('/api/guest-upload', { method: 'POST', body: fd });
            const d = await r.json();
            // 修复：原代码把服务端 message 直接拼进 innerHTML（XSS），改为 textContent
            document.getElementById('msg').textContent =
                d.success ? '✅ 上传成功' : '❌ ' + (d.message || '上传失败');
        }
    </script>
</body>

</html>
