<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>文件共享</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {

            background: #f8fafc;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 20px;

        }

        .share-card {

            width: 100%;

            max-width: 480px;

            background: white;

            border-radius: 16px;

            padding: 30px;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, .08);

        }

        .file-icon {

            font-size: 56px;

            text-align: center;

            margin-bottom: 15px;

        }

        .file-name {

            font-size: 18px;

            font-weight: 600;

            text-align: center;

            margin-bottom: 20px;

            word-break: break-all;

        }

        .info-box {

            background: #f8fafc;

            padding: 14px;

            border-radius: 10px;

            margin-bottom: 20px;

        }

        .info-item {

            font-size: 14px;

            color: #64748b;

            margin-bottom: 6px;

        }

        #errorText {

            margin-top: 10px;

            color: #dc2626;

        }

        .download-btn {

            width: 100%;

        }

        @media (prefers-color-scheme: dark) {

            body {

                background: #0f172a;

            }

            .share-card {

                background: #1e293b;

                color: white;

            }

            .info-box {

                background: #334155;

            }

            .info-item {

                color: #cbd5e1;

            }

            .form-control {

                background: #0f172a;

                color: white;

                border-color: #475569;

            }

        }
    </style>

</head>

<body>

    <div class="share-card">

        <div class="file-icon">
            📄
        </div>

        <h3 class="text-center mb-4">
            文件共享
        </h3>

        <div id="shareFileName" class="file-name">

            正在加载...

        </div>

        <div class="info-box">

            <div id="shareExpire" class="info-item">

            </div>

            <div id="sharePasswordStatus" class="info-item">

            </div>

        </div>

        <input type="password" id="sharePassword" class="form-control" placeholder="请输入提取密码">

        <div id="errorText"></div>

        <button class="btn btn-primary mt-3 download-btn" onclick="verifyShare()">

            下载文件

        </button>

    </div>

    <script>

        let currentShareId = "";

        window.onload = async function () {

            currentShareId =
                window.location.pathname
                    .split("/")
                    .pop();

            const response =
                await fetch(
                    "/api/share-info/" +
                    currentShareId
                );

            const result =
                await response.json();

            if (!result.success) {

                document.getElementById(
                    "shareFileName"
                ).innerText =
                    "共享链接不存在";

                return;
            }

            document.getElementById(
                "shareFileName"
            ).innerText =
                result.file_name;

            document.getElementById(
                "shareExpire"
            ).innerText =
                "⏰ 有效期至：" +
                result.expire;

            document.getElementById(
                "sharePasswordStatus"
            ).innerText =
                result.has_password
                    ? "🔒 已启用提取码"
                    : "🔓 无需密码";

            if (!result.has_password) {

                document
                    .getElementById(
                        "sharePassword"
                    )
                    .style.display =
                    "none";

            }

            if (result.expired) {

                document.getElementById(
                    "errorText"
                ).innerText =
                    "共享链接已过期";

                document.querySelector(
                    ".download-btn"
                ).disabled = true;
            }

        };

        async function verifyShare() {

            const fd =
                new FormData();

            fd.append(
                "share_id",
                currentShareId
            );

            fd.append(
                "password",
                document.getElementById(
                    "sharePassword"
                ).value
            );

            const response =
                await fetch(
                    "/api/share-check",
                    {
                        method: "POST",
                        body: fd
                    }
                );

            const result =
                await response.json();

            if (result.success) {

                window.location =
                    "/api/share-download/" +
                    currentShareId;

            } else {

                document.getElementById(
                    "errorText"
                ).innerText =
                    result.message;

            }

        }

    </script>

</body>

</html>
