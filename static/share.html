<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>XS 文件共享</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../static/share.css" rel="stylesheet">

</head>

<body>

    <div class="share-card">

        <div class="file-icon">
            📄
        </div>

        <h3 class="text-center mb-4">
            文件共享
        </h3>

        <div id="shareFileName" class="file-name">

            正在加载...

        </div>

        <div class="info-box">

            <div id="shareExpire" class="info-item">

            </div>

            <div id="sharePasswordStatus" class="info-item">

            </div>

        </div>

        <input type="password" id="sharePassword" class="form-control" placeholder="请输入提取密码">

        <div id="errorText"></div>

        <button class="btn btn-primary mt-3 download-btn" onclick="verifyShare()">

            下载文件

        </button>

    </div>

    <div class="modal fade" id="zipLoadingModal" tabindex="-1" data-bs-backdrop="static" data-bs-keyboard="false">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-body text-center p-4">
                    <div class="spinner-border text-primary mb-3" role="status">
                    </div>
                    <h5>
                        正在打包文件夹
                    </h5>
                    <div class="text-muted">
                        文件较大时可能需要几秒钟，请稍候...
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../static/share.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"></script>

</body>

</html>
