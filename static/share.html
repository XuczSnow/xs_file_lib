<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- 站点标题（share.js loadSiteSetting 动态替换） -->
    <title id="pageTitle">XS 文件共享</title>

    <!-- 第三方库 + 共享页样式 + 预览灯箱样式 -->
    <link href="../static/vendor/bootstrap.min.css" rel="stylesheet">
    <link href="../static/share.css" rel="stylesheet">
    <link href="../static/preview.css" rel="stylesheet">

</head>

<body>
    <!-- 首屏共享卡片：文件名/到期/密码状态/预览按钮（验证后隐藏） -->
    <div class="share-card" id="shareCard">

        <div class="file-icon">
            📄
        </div>

        <h3 class="text-center mb-4">
            文件共享
        </h3>

        <div id="shareFileName" class="file-name">
            正在加载...
        </div>

        <!-- 到期时间 + 密码状态（由 share.js 填充） -->
        <div class="info-box">
            <div id="shareExpire" class="info-item">
            </div>
            <div id="sharePasswordStatus" class="info-item">
            </div>

        </div>

        <!-- 有提取码时显示；无则 share.js 隐藏。errorText 用于校验失败/过期提示 -->
        <input type="password" id="sharePassword" class="form-control" placeholder="请输入提取密码">
        <div id="errorText"></div>
        <button class="btn btn-primary mt-3 download-btn" onclick="verifyShare()">
            预览文件
        </button>
    </div>

    <!-- 普通文件夹验证通过后由 share.js renderFolder 填充 -->
    <div class="file-card" id="fileCard">
    </div>

    <!-- 相册/视频模式验证通过后由 share.js renderAlbum 填充 -->
    <div class="album-card" id="albumCard">
    </div>

    <!-- 打包下载遮罩弹窗：静态背景、禁键盘（打包中不可关闭，避免误操作） -->
    <div class="modal fade" id="zipLoadingModal" tabindex="-1" data-bs-backdrop="static" data-bs-keyboard="false">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-body text-center p-4">
                    <div class="spinner-border text-primary mb-3" role="status">
                    </div>
                    <h5>
                        正在打包文件夹
                    </h5>
                    <div class="text-muted">
                        文件较大时可能需要几分钟，请稍候...
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 文件预览弹窗：#previewContent 由 preview.js 填充 -->
    <div class="modal fade" id="previewModal">
        <div class="modal-dialog modal-xl">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 id="previewTitle">
                        文件预览
                    </h5>
                    <button class="btn-close" data-bs-dismiss="modal">
                    </button>
                </div>

                <div class="modal-body">
                    <div id="previewContent">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 脚本加载顺序：先公共工具 → 共享页业务 → 预览 → bootstrap（弹窗依赖） -->
    <script src="../static/common.js"></script>
    <script src="../static/share.js"></script>
    <script src="../static/preview.js"></script>
    <script src="../static/vendor/bootstrap.bundle.min.js"></script>

</body>

</html>
